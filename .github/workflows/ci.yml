name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Unit tests (data sources, validation, store)
        run: bun run test

      # Runs Next's own TypeScript check as part of the build, and is also
      # the artifact the e2e step below serves via `bun run start` - built
      # once, reused, rather than building twice.
      - name: Build
        run: bun run build
        env:
          # Deliberately absent in CI - REAL mode falls back to
          # REAL_MODE_NOT_CONFIGURED gracefully (see real-data-source.ts),
          # and the e2e suite never exercises REAL mode, so no FMP key is
          # needed here and none is ever committed to the repo.
          MARKET_DATA_API_KEY: ""

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      # e2e suite is MOCK-mode-only by design - REAL mode needs a live FMP
      # key (absent here) and would otherwise burn the 250-calls/day quota
      # on every CI run. Accessibility audits (axe-core) run as part of
      # this suite, not a separate step - see e2e/accessibility.spec.ts.
      - name: E2E tests + accessibility audit
        run: bun run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Security audit
        run: bun run audit
